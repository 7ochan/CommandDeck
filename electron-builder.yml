# electron-builder configuration for CommandDeck
# Documentation: https://www.electron.build/configuration/configuration
#
# Local packaging (no code signing):
#   npm run electron:package:mac     → macOS .dmg
#   npm run electron:package:win     → Windows .exe (NSIS)
#   npm run electron:package:linux   → Linux .AppImage
#   npm run electron:package         → current OS
#
# To cross-compile or add code signing, see the docs for:
#   CSC_LINK / CSC_KEY_PASSWORD (Windows)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID (macOS)

# ─── Application identity ──────────────────────────────────────────────────────
appId: com.commanddeck.app
productName: CommandDeck
copyright: 'Copyright © 2024 CommandDeck. All rights reserved.'

# ─── Executable name ───────────────────────────────────────────────────────────
executableName: CommandDeck

# ─── Output directory ──────────────────────────────────────────────────────────
directories:
  buildResources: electron/assets
  output: dist

# ─── Build inputs ──────────────────────────────────────────────────────────────
#
# What goes into the package:
#
#   .electron/       — compiled Electron main process & preload
#   .next/           — compiled Next.js app (static + server components)
#   .server/         — compiled custom Node server (server.js)
#   public/          — static assets served by Next.js
#   node_modules/    — ALL runtime dependencies (native modules included)
#   package.json     — required by Node module resolution at runtime
#
# Why asar:false?
#   The server runs as a child process via spawn(). spawn() requires real
#   filesystem paths. node_modules with native .node binaries also cannot
#   live inside an asar archive (they must be real files). Disabling asar
#   keeps everything as real files and avoids path-translation edge cases.
#
asar: false

files:
  - .electron/**/*
  - .next/**/*
  - .server/**/*
  - public/**/*
  - package.json
  # Runtime node_modules — include everything except dev-only tools
  - node_modules/**/*
  - '!node_modules/.bin/**'
  - '!node_modules/.cache/**'
  # Exclude dev-only packages
  - '!node_modules/electron/**'
  - '!node_modules/electron-builder/**'
  - '!node_modules/eslint/**'
  - '!node_modules/eslint-*/**'
  - '!node_modules/prettier/**'
  - '!node_modules/prettier-*/**'
  - '!node_modules/typescript/**'
  - '!node_modules/vitest/**'
  - '!node_modules/@vitest/**'
  - '!node_modules/tsx/**'
  - '!node_modules/concurrently/**'
  - '!node_modules/wait-on/**'
  - '!node_modules/@types/**'
  - '!node_modules/tailwindcss/**'
  - '!node_modules/postcss/**'
  - '!node_modules/@tailwindcss/**'
  - '!node_modules/drizzle-kit/**'
  - '!node_modules/.package-lock.json'
  # Exclude source files (TypeScript, tests)
  - '!src/**'
  - '!electron/main.ts'
  - '!electron/preload.ts'
  - '!electron/tsconfig.json'
  - '!tests/**'
  - '!scripts/**'
  - '!docs/**'
  - '!*.md'
  - '!*.yml'
  - '!*.yaml'
  - '!*.mjs'
  - '!tsconfig*.json'

# ─── macOS ─────────────────────────────────────────────────────────────────────
mac:
  icon: electron/assets/icon.icns
  category: public.app-category.developer-tools
  # hardenedRuntime required for Notarization (future)
  hardenedRuntime: true
  entitlements: electron/entitlements.mac.plist
  entitlementsInherit: electron/entitlements.mac.plist
  gatekeeperAssess: false
  # Skip signing for local packaging — set APPLE_ID env vars for notarization
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

dmg:
  title: 'CommandDeck ${version}'
  icon: electron/assets/icon.icns
  iconSize: 80
  contents:
    - x: 190
      y: 250
      type: file
    - x: 490
      y: 250
      type: link
      path: /Applications
  window:
    width: 680
    height: 420

# ─── Windows ───────────────────────────────────────────────────────────────────
win:
  icon: electron/assets/icon.ico
  # Skip signing for local packaging — set CSC_LINK env var for signing
  certificateSubjectName: null
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: CommandDeck

# ─── Linux ─────────────────────────────────────────────────────────────────────
linux:
  icon: electron/assets/icon.png
  category: Development
  target:
    - target: AppImage
      arch: x64
  desktop:
    Name: CommandDeck
    Comment: 'A local-first visual terminal workspace'
    Categories: Development;Utility;TerminalEmulator;

# ─── Publish (reserved for auto-update — not yet implemented) ─────────────────
# publish: null
